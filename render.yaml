databases:
  - name: restaurant_db
    plan: free
    databaseName: restaurant
    user: restaurant

services:
  - type: web
    plan: free
    name: restaurant
    runtime: python
    pythonVersion: 3.11
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn restaurant.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
